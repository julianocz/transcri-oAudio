name: Gerar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Criar projeto Android
        run: |
          set -e
          mkdir -p app/src/main/java/br/transcritor app/src/main/assets app/src/main/res/drawable app/src/main/res/xml
          cp transcritor.html app/src/main/assets/index.html

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "Transcritor"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'br.transcritor'
            compileSdk 34
            defaultConfig {
              applicationId 'br.transcritor'
              minSdk 24
              targetSdk 34
              versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
              versionName '1.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
            }
            signingConfigs {
              debug {
                storeFile rootProject.file('debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
              }
            }
            buildTypes { debug { signingConfig signingConfigs.debug } }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          dependencies {
            implementation 'androidx.webkit:webkit:1.11.0'
            implementation 'androidx.core:core:1.13.1'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.RECORD_AUDIO"/>
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE"/>
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC"/>
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
            <uses-permission android:name="android.permission.WAKE_LOCK"/>
            <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>
            <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>
            <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/>
            <queries>
              <intent><action android:name="android.speech.RecognitionService"/></intent>
            </queries>
            <application android:label="Transcritor" android:icon="@drawable/ic"
                android:theme="@android:style/Theme.Material.Light.NoActionBar"
                android:largeHeap="true">
              <activity android:name=".MainActivity" android:exported="true"
                  android:launchMode="singleTask"
                  android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboard|keyboardHidden|navigation|uiMode|density">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
              <service android:name=".KeepAliveService" android:exported="false"
                  android:foregroundServiceType="microphone|dataSync"/>
              <provider android:name="androidx.core.content.FileProvider"
                  android:authorities="br.transcritor.files" android:exported="false"
                  android:grantUriPermissions="true">
                <meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/paths"/>
              </provider>
            </application>
          </manifest>
          EOF

          cat > app/src/main/res/xml/paths.xml <<'EOF'
          <paths><cache-path name="c" path="."/></paths>
          EOF

          cat > app/src/main/res/drawable/ic.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#0F8A6C" android:pathData="M12,0a12,12 0,1 1,0 24a12,12 0,1 1,0 -24z"/>
            <path android:fillColor="#FFFFFF" android:pathData="M12,4a2.5,2.5 0,0 1,2.5 2.5v5a2.5,2.5 0,0 1,-5 0v-5A2.5,2.5 0,0 1,12 4z"/>
            <path android:fillColor="#FFFFFF" android:pathData="M7,11h1.5a3.5,3.5 0,0 0,7 0H17a5,5 0,0 1,-4.25 4.94V18h-1.5v-2.06A5,5 0,0 1,7 11z"/>
          </vector>
          EOF

          cat > app/src/main/java/br/transcritor/KeepAliveService.java <<'EOF'
          package br.transcritor;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.PowerManager;

          public class KeepAliveService extends Service {
            static final String CH = "transcricao";
            PowerManager.WakeLock lock;

            @Override public int onStartCommand(Intent intent, int flags, int startId) {
              boolean mic = intent != null && intent.getBooleanExtra("mic", false);
              NotificationManager nm = getSystemService(NotificationManager.class);
              if (Build.VERSION.SDK_INT >= 26 && nm.getNotificationChannel(CH) == null) {
                nm.createNotificationChannel(new NotificationChannel(CH, "Transcrição", NotificationManager.IMPORTANCE_LOW));
              }
              Intent open = new Intent(this, MainActivity.class).setAction(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                  .setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_RESET_TASK_IF_NEEDED);
              PendingIntent pi = PendingIntent.getActivity(this, 0, open, PendingIntent.FLAG_IMMUTABLE);
              Notification.Builder nb = Build.VERSION.SDK_INT >= 26 ? new Notification.Builder(this, CH) : new Notification.Builder(this);
              Notification n = nb.setContentTitle("Transcritor")
                  .setContentText(mic ? "Ouvindo e transcrevendo…" : "Transcrevendo o arquivo…")
                  .setSmallIcon(R.drawable.ic).setContentIntent(pi).setOngoing(true).build();
              try {
                if (Build.VERSION.SDK_INT >= 29) {
                  startForeground(1, n, mic ? ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE : ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC);
                } else {
                  startForeground(1, n);
                }
              } catch (Exception e) {
                try { startForeground(1, n); } catch (Exception ignored) {}
              }
              if (lock == null) {
                lock = ((PowerManager) getSystemService(POWER_SERVICE)).newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "transcritor:work");
                lock.acquire(3 * 60 * 60 * 1000L);
              }
              return START_NOT_STICKY;
            }

            @Override public void onDestroy() {
              if (lock != null && lock.isHeld()) lock.release();
              super.onDestroy();
            }

            @Override public IBinder onBind(Intent i) { return null; }
          }
          EOF

          cat > app/src/main/java/br/transcritor/MainActivity.java <<'EOF'
          package br.transcritor;

          import android.Manifest;
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.Intent;
          import android.provider.Settings;
          import android.widget.Toast;
          import androidx.core.content.FileProvider;
          import org.json.JSONArray;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.ByteArrayOutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Bundle;
          import android.speech.RecognitionListener;
          import android.speech.RecognizerIntent;
          import android.speech.SpeechRecognizer;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.webkit.WebViewAssetLoader;
          import org.json.JSONObject;
          import java.util.ArrayList;

          public class MainActivity extends Activity {
            static final int REQ_FILE = 1, REQ_MIC = 2, REQ_AUDIO = 4;
            File pcmFile; int pcmSamples = 0;
            WebView web;
            SpeechRecognizer sr;
            boolean listening = false;
            ValueCallback<Uri[]> fileCb;
            File pendingApk;
            static final String RELEASES = "https://api.github.com/repos/julianocz/transcri-oAudio/releases/latest";

            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              web = new WebView(this);
              setContentView(web);
              WebSettings s = web.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              final WebViewAssetLoader loader = new WebViewAssetLoader.Builder()
                  .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this)).build();
              web.setWebViewClient(new WebViewClient() {
                @Override public WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest r) {
                  return loader.shouldInterceptRequest(r.getUrl());
                }
                @Override public boolean onRenderProcessGone(WebView v, android.webkit.RenderProcessGoneDetail d) {
                  setKeepAlive(false, false);
                  getSharedPreferences("dados", MODE_PRIVATE).edit().putString("tv_crash", "1").commit();
                  Toast.makeText(MainActivity.this, "O celular ficou sem memória e interrompeu a transcrição. Escolha o arquivo de novo para continuar de onde parou.", Toast.LENGTH_LONG).show();
                  recreate();
                  return true;
                }
              });
              web.setWebChromeClient(new WebChromeClient() {
                @Override public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb, FileChooserParams p) {
                  if (fileCb != null) fileCb.onReceiveValue(null);
                  fileCb = cb;
                  Intent i = new Intent(Intent.ACTION_GET_CONTENT);
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  i.setType("*/*");
                  i.putExtra(Intent.EXTRA_MIME_TYPES, new String[]{"audio/*", "video/*"});
                  try { startActivityForResult(Intent.createChooser(i, "Escolha o áudio"), REQ_FILE); }
                  catch (Exception e) { fileCb = null; return false; }
                  return true;
                }
              });
              if (android.os.Build.VERSION.SDK_INT >= 26) {
                web.setRendererPriorityPolicy(WebView.RENDERER_PRIORITY_IMPORTANT, false);
              }
              if (android.os.Build.VERSION.SDK_INT >= 33
                  && checkSelfPermission("android.permission.POST_NOTIFICATIONS") != PackageManager.PERMISSION_GRANTED) {
                requestPermissions(new String[]{"android.permission.POST_NOTIFICATIONS"}, 3);
              }
              web.addJavascriptInterface(new Bridge(), "AndroidSpeech");
              web.loadUrl("https://appassets.androidplatform.net/assets/index.html");
              checkUpdate(false);
            }

            @Override protected void onResume() {
              super.onResume();
              if (pendingApk != null && (android.os.Build.VERSION.SDK_INT < 26 || getPackageManager().canRequestPackageInstalls())) {
                File f = pendingApk; pendingApk = null; install(f);
              }
            }

            static String readAll(InputStream in) throws Exception {
              ByteArrayOutputStream o = new ByteArrayOutputStream();
              byte[] buf = new byte[8192]; int n;
              while ((n = in.read(buf)) > 0) o.write(buf, 0, n);
              in.close();
              return o.toString("UTF-8");
            }

            void checkUpdate(final boolean manual) {
              new Thread(() -> {
                try {
                  HttpURLConnection c = (HttpURLConnection) new URL(RELEASES).openConnection();
                  c.setRequestProperty("Accept", "application/vnd.github+json");
                  c.setConnectTimeout(10000); c.setReadTimeout(10000);
                  if (c.getResponseCode() != 200) { if (manual) say("Não consegui verificar agora. Tente de novo."); return; }
                  JSONObject j = new JSONObject(readAll(c.getInputStream()));
                  int latest = Integer.parseInt(j.getString("tag_name").replaceAll("[^0-9]", ""));
                  int mine = getPackageManager().getPackageInfo(getPackageName(), 0).versionCode;
                  if (latest <= mine) { if (manual) say("Você já está na versão mais recente."); return; }
                  JSONArray a = j.getJSONArray("assets");
                  String url = null;
                  for (int i = 0; i < a.length(); i++) {
                    JSONObject x = a.getJSONObject(i);
                    if (x.getString("name").endsWith(".apk")) url = x.getString("browser_download_url");
                  }
                  if (url == null) return;
                  final String u = url;
                  runOnUiThread(() -> new AlertDialog.Builder(this)
                      .setTitle("Atualização disponível")
                      .setMessage("Há uma versão nova do Transcritor. Baixar e instalar agora?")
                      .setPositiveButton("Atualizar", (d, w) -> download(u))
                      .setNegativeButton("Depois", null)
                      .show());
                } catch (Exception e) { if (manual) say("Não consegui verificar agora. Tente de novo."); }
              }).start();
            }

            void say(String m) { runOnUiThread(() -> Toast.makeText(this, m, Toast.LENGTH_LONG).show()); }

            void download(String u) {
              Toast.makeText(this, "Baixando atualização…", Toast.LENGTH_SHORT).show();
              new Thread(() -> {
                try {
                  String next = u; HttpURLConnection c = null;
                  for (int k = 0; k < 5; k++) {
                    c = (HttpURLConnection) new URL(next).openConnection();
                    c.setInstanceFollowRedirects(false);
                    int code = c.getResponseCode();
                    if (code >= 300 && code < 400) { next = c.getHeaderField("Location"); continue; }
                    break;
                  }
                  File f = new File(getCacheDir(), "update.apk");
                  InputStream in = c.getInputStream();
                  FileOutputStream out = new FileOutputStream(f);
                  byte[] buf = new byte[16384]; int n;
                  while ((n = in.read(buf)) > 0) out.write(buf, 0, n);
                  out.close(); in.close();
                  runOnUiThread(() -> install(f));
                } catch (Exception e) {
                  runOnUiThread(() -> Toast.makeText(this, "Não consegui baixar a atualização.", Toast.LENGTH_LONG).show());
                }
              }).start();
            }

            void install(File f) {
              if (android.os.Build.VERSION.SDK_INT >= 26 && !getPackageManager().canRequestPackageInstalls()) {
                pendingApk = f;
                Toast.makeText(this, "Permita instalar atualizações e volte ao app.", Toast.LENGTH_LONG).show();
                startActivity(new Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:" + getPackageName())));
                return;
              }
              Uri uri = FileProvider.getUriForFile(this, "br.transcritor.files", f);
              Intent i = new Intent(Intent.ACTION_VIEW).setDataAndType(uri, "application/vnd.android.package-archive")
                  .addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
              startActivity(i);
            }

            @Override protected void onActivityResult(int req, int res, Intent data) {
              super.onActivityResult(req, res, data);
              if (req == REQ_AUDIO && res == RESULT_OK && data != null && data.getData() != null) {
                final Uri u = data.getData();
                audio("start", "");
                new Thread(() -> decode(u)).start();
                return;
              }
              if (req == REQ_FILE && fileCb != null) {
                fileCb.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(res, data));
                fileCb = null;
              }
            }

            void send(String type, String text) {
              final String js = "window.__speech&&window.__speech(" + JSONObject.quote(type) + ","
                  + JSONObject.quote(text == null ? "" : text) + ")";
              runOnUiThread(() -> web.evaluateJavascript(js, null));
            }

            class Bridge {
              @JavascriptInterface public boolean available() { return SpeechRecognizer.isRecognitionAvailable(MainActivity.this); }
              @JavascriptInterface public void start() { runOnUiThread(() -> startMic()); }
              @JavascriptInterface public void stop() { runOnUiThread(() -> stopMic()); }
              @JavascriptInterface public void keepAlive(boolean on, boolean mic) { runOnUiThread(() -> setKeepAlive(on, mic)); }
              @JavascriptInterface public String load(String k) { return getSharedPreferences("dados", MODE_PRIVATE).getString(k, ""); }
              @JavascriptInterface public void save(String k, String v) { getSharedPreferences("dados", MODE_PRIVATE).edit().putString(k, v).commit(); }
              @JavascriptInterface public String version() {
                try { return getPackageManager().getPackageInfo(getPackageName(), 0).versionName; } catch (Exception e) { return ""; }
              }
              @JavascriptInterface public void checkUpdates() { runOnUiThread(() -> checkUpdate(true)); }
              @JavascriptInterface public boolean saveTxt(String name, String content) { return saveToDownloads(name, content); }
              @JavascriptInterface public void pickAudio() { runOnUiThread(() -> {
                Intent i = new Intent(Intent.ACTION_GET_CONTENT);
                i.addCategory(Intent.CATEGORY_OPENABLE);
                i.setType("*/*");
                i.putExtra(Intent.EXTRA_MIME_TYPES, new String[]{"audio/*", "video/*", "application/ogg"});
                try { startActivityForResult(Intent.createChooser(i, "Escolha o áudio"), REQ_AUDIO); } catch (Exception e) {}
              }); }
              @JavascriptInterface public String chunk(int k) {
                try (java.io.RandomAccessFile f = new java.io.RandomAccessFile(pcmFile, "r")) {
                  long off = (long) k * 30 * 16000 * 2;
                  int len = (int) Math.max(0, Math.min(30L * 16000 * 2, f.length() - off));
                  byte[] b = new byte[len];
                  f.seek(off); f.readFully(b);
                  return android.util.Base64.encodeToString(b, android.util.Base64.NO_WRAP);
                } catch (Exception e) { return ""; }
              }
            }

            void askBattery() {
              try {
                android.os.PowerManager pm = (android.os.PowerManager) getSystemService(POWER_SERVICE);
                android.content.SharedPreferences sp = getSharedPreferences("app", MODE_PRIVATE);
                if (android.os.Build.VERSION.SDK_INT >= 23 && !pm.isIgnoringBatteryOptimizations(getPackageName())
                    && !sp.getBoolean("askedBattery", false)) {
                  sp.edit().putBoolean("askedBattery", true).apply();
                  startActivity(new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, Uri.parse("package:" + getPackageName())));
                }
              } catch (Exception ignored) {}
            }

            boolean saveToDownloads(String name, String content) {
              try {
                byte[] b = content.getBytes("UTF-8");
                if (android.os.Build.VERSION.SDK_INT >= 29) {
                  android.content.ContentValues v = new android.content.ContentValues();
                  v.put(android.provider.MediaStore.MediaColumns.DISPLAY_NAME, name);
                  v.put(android.provider.MediaStore.MediaColumns.MIME_TYPE, "text/plain");
                  v.put(android.provider.MediaStore.MediaColumns.RELATIVE_PATH, "Download/Transcritor");
                  Uri u = getContentResolver().insert(android.provider.MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
                  java.io.OutputStream o = getContentResolver().openOutputStream(u);
                  o.write(b); o.close();
                } else {
                  File d = new File(android.os.Environment.getExternalStoragePublicDirectory(android.os.Environment.DIRECTORY_DOWNLOADS), "Transcritor");
                  d.mkdirs();
                  FileOutputStream o = new FileOutputStream(new File(d, name));
                  o.write(b); o.close();
                }
                return true;
              } catch (Exception e) { return false; }
            }

            void audio(String type, String payload) {
              final String js = "window.__audio&&window.__audio(" + JSONObject.quote(type) + "," + JSONObject.quote(payload) + ")";
              runOnUiThread(() -> web.evaluateJavascript(js, null));
            }

            void decode(Uri uri) {
              String name = "audio"; long size = 0;
              try (android.database.Cursor c = getContentResolver().query(uri, null, null, null, null)) {
                if (c != null && c.moveToFirst()) {
                  int ni = c.getColumnIndex(android.provider.OpenableColumns.DISPLAY_NAME);
                  int si = c.getColumnIndex(android.provider.OpenableColumns.SIZE);
                  if (ni >= 0) name = c.getString(ni);
                  if (si >= 0) size = c.getLong(si);
                }
              } catch (Exception ignored) {}
              android.media.MediaExtractor ex = new android.media.MediaExtractor();
              android.media.MediaCodec codec = null;
              File out = new File(getCacheDir(), "audio.pcm");
              try (java.io.BufferedOutputStream os = new java.io.BufferedOutputStream(new FileOutputStream(out), 1 << 16)) {
                ex.setDataSource(this, uri, null);
                int track = -1; android.media.MediaFormat fmt = null;
                for (int i = 0; i < ex.getTrackCount(); i++) {
                  android.media.MediaFormat f = ex.getTrackFormat(i);
                  String m = f.getString(android.media.MediaFormat.KEY_MIME);
                  if (m != null && m.startsWith("audio/")) { track = i; fmt = f; break; }
                }
                if (track < 0) throw new Exception("sem áudio");
                ex.selectTrack(track);
                long durUs = fmt.containsKey(android.media.MediaFormat.KEY_DURATION) ? fmt.getLong(android.media.MediaFormat.KEY_DURATION) : 0;
                codec = android.media.MediaCodec.createDecoderByType(fmt.getString(android.media.MediaFormat.KEY_MIME));
                codec.configure(fmt, null, null, 0);
                codec.start();
                int rate = fmt.getInteger(android.media.MediaFormat.KEY_SAMPLE_RATE);
                int ch = fmt.getInteger(android.media.MediaFormat.KEY_CHANNEL_COUNT);
                boolean isFloat = false;
                double step = rate / 16000.0, t = 0; long n = -1; float prev = 0; int count = 0;
                android.media.MediaCodec.BufferInfo info = new android.media.MediaCodec.BufferInfo();
                boolean inDone = false, outDone = false; long lastUi = 0;
                byte[] two = new byte[2];
                while (!outDone) {
                  if (!inDone) {
                    int ii = codec.dequeueInputBuffer(10000);
                    if (ii >= 0) {
                      java.nio.ByteBuffer ib = codec.getInputBuffer(ii);
                      int sz = ex.readSampleData(ib, 0);
                      if (sz < 0) { codec.queueInputBuffer(ii, 0, 0, 0, android.media.MediaCodec.BUFFER_FLAG_END_OF_STREAM); inDone = true; }
                      else { codec.queueInputBuffer(ii, 0, sz, ex.getSampleTime(), 0); ex.advance(); }
                    }
                  }
                  int oi = codec.dequeueOutputBuffer(info, 10000);
                  if (oi == android.media.MediaCodec.INFO_OUTPUT_FORMAT_CHANGED) {
                    android.media.MediaFormat of = codec.getOutputFormat();
                    rate = of.getInteger(android.media.MediaFormat.KEY_SAMPLE_RATE);
                    ch = of.getInteger(android.media.MediaFormat.KEY_CHANNEL_COUNT);
                    isFloat = of.containsKey("pcm-encoding") && of.getInteger("pcm-encoding") == android.media.AudioFormat.ENCODING_PCM_FLOAT;
                    step = rate / 16000.0;
                  } else if (oi >= 0) {
                    java.nio.ByteBuffer ob = codec.getOutputBuffer(oi);
                    ob.position(info.offset); ob.limit(info.offset + info.size);
                    ob.order(java.nio.ByteOrder.LITTLE_ENDIAN);
                    int bps = isFloat ? 4 : 2;
                    int frames = info.size / (bps * ch);
                    for (int fI = 0; fI < frames; fI++) {
                      float sum = 0;
                      for (int c = 0; c < ch; c++) sum += isFloat ? ob.getFloat() : ob.getShort() / 32768f;
                      float x = sum / ch;
                      n++;
                      while (t <= n) {
                        float y = n == 0 ? x : prev + (float) (t - (n - 1)) * (x - prev);
                        int v = Math.max(-32768, Math.min(32767, Math.round(y * 32767)));
                        two[0] = (byte) v; two[1] = (byte) (v >> 8);
                        os.write(two); count++;
                        t += step;
                      }
                      prev = x;
                    }
                    codec.releaseOutputBuffer(oi, false);
                    if ((info.flags & android.media.MediaCodec.BUFFER_FLAG_END_OF_STREAM) != 0) outDone = true;
                    long now = System.currentTimeMillis();
                    if (durUs > 0 && now - lastUi > 700) {
                      lastUi = now;
                      audio("progress", String.valueOf(Math.min(99, (int) (info.presentationTimeUs * 100 / durUs))));
                    }
                  }
                }
                os.flush();
                pcmFile = out; pcmSamples = count;
                JSONObject j = new JSONObject();
                j.put("name", name); j.put("size", size); j.put("samples", count);
                audio("ready", j.toString());
              } catch (Exception e) {
                audio("error", "Não consegui ler esse áudio. Tente outro formato (.mp3, .m4a, .wav).");
              } finally {
                try { if (codec != null) { codec.stop(); codec.release(); } } catch (Exception ignored) {}
                ex.release();
              }
            }

            void setKeepAlive(boolean on, boolean mic) {
              Intent i = new Intent(this, KeepAliveService.class).putExtra("mic", mic);
              try {
                if (on) askBattery();
                if (on) {
                  if (android.os.Build.VERSION.SDK_INT >= 26) startForegroundService(i); else startService(i);
                } else {
                  stopService(i);
                }
              } catch (Exception ignored) {}
            }

            void startMic() {
              if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, REQ_MIC);
                return;
              }
              listening = true;
              send("state", "listening");
              listen();
            }

            @Override public void onRequestPermissionsResult(int r, String[] p, int[] g) {
              if (r == REQ_MIC) {
                if (g.length > 0 && g[0] == PackageManager.PERMISSION_GRANTED) startMic();
                else send("state", "denied");
              }
            }

            void listen() {
              if (sr == null) {
                sr = SpeechRecognizer.createSpeechRecognizer(this);
                sr.setRecognitionListener(new RecognitionListener() {
                  public void onReadyForSpeech(Bundle b) {}
                  public void onBeginningOfSpeech() {}
                  public void onRmsChanged(float f) {}
                  public void onBufferReceived(byte[] b) {}
                  public void onEndOfSpeech() {}
                  public void onEvent(int t, Bundle b) {}
                  public void onPartialResults(Bundle b) {
                    ArrayList<String> r = b.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                    if (r != null && !r.isEmpty()) send("partial", r.get(0));
                  }
                  public void onResults(Bundle b) {
                    ArrayList<String> r = b.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                    if (r != null && !r.isEmpty()) send("final", r.get(0));
                    again();
                  }
                  public void onError(int e) {
                    if (e == SpeechRecognizer.ERROR_INSUFFICIENT_PERMISSIONS) { listening = false; send("state", "denied"); return; }
                    again();
                  }
                });
              }
              Intent i = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
              i.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
              i.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "pt-BR");
              i.putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true);
              sr.startListening(i);
            }

            void again() {
              if (listening) web.postDelayed(() -> { if (listening) listen(); }, 150);
              else send("state", "idle");
            }

            void stopMic() {
              listening = false;
              if (sr != null) sr.stopListening();
              send("state", "idle");
            }

            @Override protected void onDestroy() {
              setKeepAlive(false, false);
              if (sr != null) sr.destroy();
              super.onDestroy();
            }

            @Override public void onBackPressed() {
              if (web.canGoBack()) web.goBack(); else moveTaskToBack(true);
            }
          }
          EOF

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon

      - name: Renomear
        run: cp app/build/outputs/apk/debug/app-debug.apk Transcritor.apk

      - name: Publicar para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Transcritor ${{ github.run_number }}
          files: Transcritor.apk
